services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transformer-interpretability
    ports:
      - "8501:8501"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8501', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
